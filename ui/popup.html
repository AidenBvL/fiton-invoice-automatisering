<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing:border-box; }
  body {
    width:270px; margin:0; padding:16px;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:#0f172a; background:#fff;
  }
  h1 { font-size:14px; margin:0 0 2px; letter-spacing:-.01em; }
  .ver { font-size:11px; color:#64748b; margin-bottom:14px; }
  .state { display:flex; align-items:center; gap:8px; font-size:12px; padding:9px 10px;
           border:1px solid #e2e8f0; border-radius:7px; background:#f8fafc; margin-bottom:8px; }
  .dot { width:7px; height:7px; border-radius:50%; background:#94a3b8; flex:none; }
  .dot.ok { background:#15803d; }
  .dot.warn { background:#f59e0b; }
  button { width:100%; border:1px solid #cbd5e1; background:#fff; color:#0f172a;
           border-radius:6px; padding:8px; font:inherit; font-size:12.5px; font-weight:600;
           cursor:pointer; margin-top:6px; }
  button.primary { background:#1d4ed8; color:#fff; border-color:#1d4ed8; }
  button:hover { opacity:.92; }
  .msg { font-size:11.5px; color:#64748b; margin-top:9px; min-height:16px; }
</style>
</head>
<body>
  <h1>FitOn Invoice Automation</h1>
  <div class="ver">Versie <span id="version">–</span></div>

  <div class="state"><span class="dot ok"></span><span>Omzetpagina: klaar</span></div>
  <div class="state"><span class="dot" id="cost-dot"></span><span id="cost-text">Kostenpagina: nog niet ingesteld</span></div>

  <button class="primary" id="dashboard">Dashboard openen</button>
  <button id="options">Instellingen</button>
  <button id="check">Controleer op updates</button>
  <div class="msg" id="msg"></div>
<script src="popup.js"></script>
</body>
</html>
